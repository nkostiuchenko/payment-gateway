services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DB:-postgres}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
